name: Probe
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -x
          { mkdir x && cd x && npm pack "@capgo/capacitor-social-login@6.0.1" && tar xzf *.tgz
            cat package/dist/esm/definitions.d.ts
            cat package/android/src/main/java/ee/forgr/capacitor/social/login/SocialLoginPlugin.java
            sed -n '60,700p' package/android/src/main/java/ee/forgr/capacitor/social/login/GoogleProvider.java
            cat package/android/src/main/AndroidManifest.xml
            npm view @capacitor/network@^6 version
          } > /tmp/probe.txt 2>&1; cd $GITHUB_WORKSPACE 2>/dev/null || cd ~; cat /tmp/probe.txt
          true
          true
