name: Web link (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths: [ 'www/index.html', 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp www/index.html _site/index.html
          sed -i "s/const C = '966ph-v1'/const C = '966ph-${GITHUB_SHA::8}'/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
